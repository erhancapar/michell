name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wheel:
    name: Wheel on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux, Windows, macOS on Intel, macOS on Apple silicon.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        # One abi3 wheel serves every Python from 3.10 up; test the oldest and the newest.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Install the wheel
        shell: bash
        # The oldest Python is also tested with the oldest NumPy that pyproject.toml allows.
        run: python -m pip install --only-binary=:all: dist/michell-*.whl pytest scipy "${{ matrix.python == '3.10' && 'numpy==2.0.*' || 'numpy' }}"
      - name: Run the command
        run: michell --version
      - name: Run the tests against the installed package
        run: python -m pytest -v

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "michell"
dynamic = ["version"]  # taken from Cargo.toml, so Rust and Python share one version number
description = "Generative design by topology optimisation, with a Rust engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Erhan Çapar" }]
dependencies = ["numpy>=2.0"]  # the oldest NumPy the tests are run against
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
michell = "michell.cli:main"

[dependency-groups]
test = ["pytest>=8", "scipy"]  # SciPy computes reference optima independently in the tests

[tool.maturin]
manifest-path = "crates/michell-py/Cargo.toml"
python-source = "python"
module-name = "michell._engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode adds nothing from this folder to sys.path, so the tests see the installed package.
addopts = "--import-mode=importlib"
